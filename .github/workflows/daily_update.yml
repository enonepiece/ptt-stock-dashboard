name: Daily 10-Day Analytics Data Auto-Update

on:
  schedule:
    # 每天台灣時間凌晨 00:30 (UTC 16:30) 自動執行
    - cron: '30 16 * * *'
  workflow_dispatch: # 允許在 GitHub 網頁上隨時手動點擊「Run workflow」觸發

permissions:
  contents: write

jobs:
  update-analytics:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 簽出代碼庫 (Checkout repository)
        uses: actions/checkout@v4

      - name: ⚙️ 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 安裝依賴套件
        run: npm ci || npm install

      - name: 🚀 抓取最新 PTT 數據並編譯快照
        run: node scripts/update_analytics_data.js

      - name: 💾 自動提交並推送更新至 main 分支
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/analytics_10days_cache.json _worker.js worker.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(auto): update 10-day analytics dataset [skip ci]" && git push)
